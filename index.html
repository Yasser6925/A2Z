<title>A To Z Market</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
/* Layout: sticky bar (brand, search, cart) + category chips, then a dense product grid; cart is a bottom sheet that ends in a WhatsApp order link. */
:root{
  --bg:#f3f7fd;
  --surface:#ffffff;
  --surface-2:#e9f0fb;
  --line:#d5e1f3;
  --fg:#0c1b3a;
  --muted:#52607d;
  --blue:#007de5;
  --navy:#003ca9;
  --yellow:#ffa900;
  --yellow-soft:#ffe6a8;
  --on-blue:#ffffff;
  --price:#003ca9;
  --wa:#15803d;
  --on-wa:#ffffff;
  --danger:#b42318;
  --shadow:0 1px 2px rgba(0,40,110,.08),0 6px 18px rgba(0,40,110,.06);
  --font:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08122b;--surface:#101e42;--surface-2:#16275a;--line:#243a73;--fg:#eaf0ff;--muted:#9fb0d6;
  --blue:#3b9bff;--navy:#7db8ff;--yellow:#ffb92e;--yellow-soft:#4a3a0c;--on-blue:#04122e;--price:#8cc4ff;
  --wa:#22a55a;--on-wa:#04140a;--danger:#ff8a80;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08122b;--surface:#101e42;--surface-2:#16275a;--line:#243a73;--fg:#eaf0ff;--muted:#9fb0d6;
  --blue:#3b9bff;--navy:#7db8ff;--yellow:#ffb92e;--yellow-soft:#4a3a0c;--on-blue:#04122e;--price:#8cc4ff;
  --wa:#22a55a;--on-wa:#04140a;--danger:#ff8a80;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}

.wrap{max-width:1180px;margin-inline:auto}

/* sticky bar */
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));
  border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;flex:none;text-decoration:none;color:inherit}
.brand img{height:46px;width:auto;display:block}
.brand b{font-size:17px;font-weight:800;line-height:1.1;display:block;color:var(--navy)}
.brand small{color:var(--muted);font-size:12px;display:block}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;height:44px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;
  padding-inline:14px 40px;font-size:15px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;inset-inline-end:12px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted);pointer-events:none}
.cartbtn{flex:none;position:relative;height:44px;padding-inline:14px;border:0;border-radius:12px;background:var(--blue);color:var(--on-blue);
  font-weight:700;display:flex;align-items:center;gap:8px}
.cartbtn svg{width:20px;height:20px}
.cartbtn .cnt{min-width:22px;height:22px;border-radius:11px;background:var(--yellow);color:#1b1300;font-size:12px;font-weight:800;
  display:grid;place-items:center;padding-inline:5px}
.cartbtn .lbl{display:none}

.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.chip small{color:var(--muted);font-weight:400;margin-inline-start:4px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip[aria-pressed="true"] small{color:#d7e5ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
 :root:not([data-theme="light"]) .chip[aria-pressed="true"] small{color:var(--on-blue)}}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
:root[data-theme="dark"] .chip[aria-pressed="true"] small{color:var(--on-blue)}

/* intro strip */
.intro{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px 12px}
.intro h1{margin:0;font-size:19px;font-weight:800;text-wrap:balance}
.intro p{margin:0;color:var(--muted);font-size:14px}
.sort{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.sort select{height:38px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding-inline:10px;color:var(--fg)}

/* products */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1120px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .cat{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:20px}
.badge{background:var(--yellow-soft);color:#6b4600;border-radius:6px;padding:0 7px;font-size:11px;font-weight:700;white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{color:#ffd678}}
:root[data-theme="dark"] .badge{color:#ffd678}
.card h3{margin:0;font-size:14.5px;font-weight:700;line-height:1.45;flex:1;overflow-wrap:anywhere;text-wrap:pretty}
.buy{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.price{font-weight:800;font-size:17px;color:var(--price);font-variant-numeric:tabular-nums;line-height:1.1}
.price small{font-size:11px;font-weight:600;color:var(--muted);margin-inline-start:3px}
.add{height:38px;min-width:38px;padding-inline:12px;border:0;border-radius:10px;background:var(--blue);color:var(--on-blue);font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px}
.add svg{width:18px;height:18px}
.step{display:flex;align-items:center;border-radius:10px;background:var(--surface-2);border:1.5px solid var(--blue);overflow:hidden}
.step button{width:34px;height:36px;border:0;background:transparent;font-size:20px;font-weight:700;color:var(--blue);line-height:1}
.step button:disabled{opacity:.35;cursor:default}
.step output{min-width:24px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.more{display:block;margin:20px auto 0;height:44px;padding-inline:28px;border-radius:12px;border:1.5px solid var(--blue);background:transparent;color:var(--blue);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:56px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
footer{margin-top:36px;padding-block:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center}

/* bottom cart bar */
.cartbar{position:fixed;inset-inline:0;bottom:0;z-index:25;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,30,90,.12)}
.cartbar button{display:flex;width:100%;max-width:560px;margin-inline:auto;height:52px;border:0;border-radius:14px;background:var(--blue);color:var(--on-blue);
  align-items:center;justify-content:space-between;padding-inline:18px;font-weight:800;font-size:16px}
.cartbar .n{display:flex;align-items:center;gap:10px}
.cartbar .n i{font-style:normal;background:var(--yellow);color:#1b1300;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:13px;padding-inline:6px}
.cartbar .t{font-variant-numeric:tabular-nums}

/* cart sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(4,12,34,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(600px,100%);max-height:92vh;max-height:92dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:88vh}}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.sheet header h2{margin:0;font-size:19px;font-weight:800}
.x{width:40px;height:40px;border-radius:10px;border:0;background:var(--surface-2);font-size:22px;line-height:1;color:var(--fg)}
.sheet .body{overflow-y:auto;padding:6px 18px 12px;flex:1;min-height:0}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding-block:12px;border-bottom:1px solid var(--line)}
.line .nm{font-weight:700;font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}
.line .sub{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.line .tot{font-weight:800;color:var(--price);font-variant-numeric:tabular-nums;text-align:end;white-space:nowrap}
.line .ctl{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px}
.rm{border:0;background:transparent;color:var(--danger);font-weight:600;font-size:13px;padding:6px 4px}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding-block:14px 6px;font-weight:800;font-size:18px}
.sum span:last-child{color:var(--price);font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:13px;margin:0 0 6px}
form.cust{display:grid;gap:10px;padding-top:12px}
.fld{display:grid;gap:4px}
.fld label{font-size:13.5px;font-weight:700}
.fld input,.fld textarea{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:15px}
.fld textarea{min-height:64px;resize:vertical}
.fld[data-bad="1"] input,.fld[data-bad="1"] textarea{border-color:var(--danger)}
.fld .err{color:var(--danger);font-size:12.5px;display:none}
.fld[data-bad="1"] .err{display:block}
.sheet footer{margin:0;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);text-align:start}
.send{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:14px;background:var(--wa);color:var(--on-wa);font-weight:800;font-size:17px;text-decoration:none;width:100%}
.send svg{width:24px;height:24px}
.clear{margin-top:8px;width:100%;height:40px;border:0;background:transparent;color:var(--muted);font-weight:600}
.cartempty{text-align:center;color:var(--muted);padding:40px 12px}

.toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;margin-inline:auto;width:fit-content;max-width:calc(100% - 32px);
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}

@media (min-width:720px){
  .cartbtn .lbl{display:inline}
  .brand b{font-size:19px}
  body{padding-block:0 100px}
}
@media (max-width:420px){.brand span{display:none}}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
}
</style>

:"ويفر ترين","c":"شيبس وبسكويت","p":20,"s":999},{"n":"ويفر كورسا","c":"شيبس وبسكويت","p":30,"s":999},{"n":"ويفي شيبس","c":"شيبس وبسكويت","p":30,"s":999},{"n":"وينستون فضي مخصص","c":"دخان ولوازم أركيلة","p":200,"s":999},{"n":"ويننستون أزرق مخصص","c":"دخان ولوازم أركيلة","p":200,"s":999},{"n":"يرنجلز صغير","c":"شيبس وبسكويت","p":115,"s":999},{"n":"يلو تشيز و سادة نيو بارك","c":"ألبان وأجبان وحليب","p":220,"s":999}];

/* ===== أدوات ===== */
const $ = id => document.getElementById(id);
const fmt = n => (Math.round(n * 100) / 100).toLocaleString("en-US");
const norm = s => s.toLowerCase().replace(/[ً-ْـ]/g, "").replace(/[أإآٱ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/\s+/g, " ").trim();
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

PRODUCTS.forEach((p, i) => { p.id = i; p.k = norm(p.n); p.h = esc(p.n); });
const CATS = (() => { const m = new Map(); PRODUCTS.forEach(p => m.set(p.c, (m.get(p.c) || 0) + 1)); return [...m].sort((a, b) => b[1] - a[1]); })();

/* ===== الحالة ===== */
let cat = "";           // "" = الكل
let query = "";
let sortBy = "name";
let shown = 60;
let cart = {};          // id -> qty
const saved = store.get("atoz-cart", {});
Object.keys(saved).forEach(id => { const p = PRODUCTS[id]; if (p && saved[id] > 0) cart[id] = Math.min(saved[id], p.s); });
let cust = store.get("atoz-cust", { name: "", phone: "", address: "", notes: "" });

const saveCart = () => store.set("atoz-cart", cart);
const cartCount = () => Object.values(cart).reduce((a, b) => a + b, 0);
const cartTotal = () => Object.entries(cart).reduce((a, [id, q]) => a + PRODUCTS[id].p * q, 0);

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2600);
}

/* ===== التصنيفات ===== */
function renderChips() {
  const all = [["", "الكل", PRODUCTS.length], ...CATS.map(([c, n]) => [c, c, n])];
  $("chips").innerHTML = all.map(([v, label, n]) =>
    `<button class="chip" type="button" data-cat="${v}" aria-pressed="${v === cat}">${label}<small>${n}</small></button>`).join("");
}
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  cat = b.dataset.cat; shown = 60; renderChips(); renderGrid();
  b.scrollIntoView({ inline: "center", block: "nearest" });
});

/* ===== المنتجات ===== */
function filtered() {
  const terms = norm(query).split(" ").filter(Boolean);
  let list = PRODUCTS.filter(p => (!cat || p.c === cat) && terms.every(t => p.k.includes(t)));
  if (sortBy === "name") list.sort((a, b) => a.n.localeCompare(b.n, "ar"));
  else if (sortBy === "asc") list.sort((a, b) => a.p - b.p || a.n.localeCompare(b.n, "ar"));
  else list.sort((a, b) => b.p - a.p || a.n.localeCompare(b.n, "ar"));
  return list;
}

function buyControl(p) {
  const q = cart[p.id] || 0;
  if (!q) return `<button class="add" type="button" data-act="add" data-id="${p.id}" aria-label="أضف ${p.h} إلى السلة">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>أضف</button>`;
  return stepper(p, q);
}
function stepper(p, q) {
  return `<div class="step" role="group" aria-label="الكمية">
    <button type="button" data-act="inc" data-id="${p.id}" aria-label="زيادة" ${q >= p.s ? "disabled" : ""}>+</button>
    <output>${q}</output>
    <button type="button" data-act="dec" data-id="${p.id}" aria-label="إنقاص">−</button></div>`;
}

function cardHTML(p) {
  const low = p.s <= 3 ? `<span class="badge">${p.s === 1 ? "قطعة وحدة" : "آخر " + p.s + " قطع"}</span>` : "";
  return `<article class="card" data-card="${p.id}">
    <div class="cat"><span>${cat ? "" : p.c}</span>${low}</div>
    <h3>${p.h}</h3>
    <div class="buy"><div class="price">${fmt(p.p)}<small>${CONFIG.currency}</small></div><div class="ctl">${buyControl(p)}</div></div>
  </article>`;
}

function renderGrid() {
  const list = filtered();
  $("title").textContent = cat || "كل المنتجات";
  $("count").textContent = list.length + " منتج" + (query ? " لنتيجة البحث" : "");
  $("grid").innerHTML = list.slice(0, shown).map(cardHTML).join("");
  $("more").hidden = list.length <= shown;
  $("empty").hidden = list.length > 0;
  if (list.length > shown) $("more").textContent = "عرض المزيد (" + (list.length - shown) + ")";
}
$("more").addEventListener("click", () => { shown += 60; renderGrid(); });
$("q").addEventListener("input", e => { query = e.target.value; shown = 60; renderGrid(); });
$("sort").addEventListener("change", e => { sortBy = e.target.value; shown = 60; renderGrid(); });

function refreshCard(id) {
  const el = document.querySelector(`[data-card="${id}"] .ctl`);
  if (el) el.innerHTML = buyControl(PRODUCTS[id]);
}

function setQty(id, q) {
  const p = PRODUCTS[id];
  if (q > p.s) { q = p.s; toast("المتوفر من هالمنتج " + p.s + " فقط"); }
  if (q <= 0) delete cart[id]; else cart[id] = q;
  saveCart(); refreshCard(id); updateBar();
  if (!$("scrim").hidden) renderCart();
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.id, a = b.dataset.act, q = cart[id] || 0;
  if (a === "add") setQty(id, 1);
  else if (a === "inc") setQty(id, q + 1);
  else if (a === "dec") setQty(id, q - 1);
  else if (a === "rm") setQty(id, 0);
});

/* ===== شريط السلة ===== */
function updateBar() {
  const n = cartCount(), t = cartTotal();
  $("cnt").textContent = n; $("cnt2").textContent = n;
  $("tot2").textContent = fmt(t) + " " + CONFIG.currency;
  $("cartbar").hidden = n === 0 || !$("scrim").hidden;
}

/* ===== نافذة السلة ===== */
let lastFocus = null;
function openCart() {
  lastFocus = document.activeElement;
  $("scrim").hidden = false; document.body.style.overflow = "hidden";
  renderCart(); updateBar(); $("closeCart").focus();
}
function closeCart() {
  $("scrim").hidden = true; document.body.style.overflow = "";
  updateBar(); if (lastFocus && lastFocus.focus) lastFocus.focus();
}
$("openCart").addEventListener("click", openCart);
$("openCart2").addEventListener("click", openCart);
$("closeCart").addEventListener("click", closeCart);
$("scrim").addEventListener("click", e => { if (e.target === $("scrim")) closeCart(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("scrim").hidden) closeCart(); });
$("clear").addEventListener("click", () => {
  Object.keys(cart).forEach(id => delete cart[id]); saveCart(); renderGrid(); updateBar(); renderCart();
});

function renderCart() {
  const ids = Object.keys(cart);
  const body = $("cartBody");
  if (!ids.length) {
    body.innerHTML = `<div class="cartempty"><b>السلة فاضية</b><br>أضف منتجات من القائمة وبترجع لهون.</div>`;
    $("cartFoot").hidden = true; return;
  }
  $("cartFoot").hidden = false;
  const lines = ids.map(id => { const p = PRODUCTS[id], q = cart[id];
    return `<div class="line">
      <div><div class="nm">${p.h}</div><div class="sub">${fmt(p.p)} ${CONFIG.currency} للقطعة</div></div>
      <div class="tot">${fmt(p.p * q)} ${CONFIG.currency}</div>
      <div class="ctl">${stepper(p, q)}<button class="rm" type="button" data-act="rm" data-id="${id}">حذف</button></div>
    </div>`; }).join("");
  body.innerHTML = lines + `<div class="sum"><span>المجموع</span><span>${fmt(cartTotal())} ${CONFIG.currency}</span></div>
    <p class="hint">أجور التوصيل (إن وجدت) بنتفق عليها على واتساب.</p>
    <form class="cust" id="cust" novalidate>
      <div class="fld" data-f="name"><label for="f-name">الاسم</label><input id="f-name" autocomplete="name" value="${esc(cust.name)}"><span class="err">اكتب اسمك</span></div>
      <div class="fld" data-f="phone"><label for="f-phone">رقم الهاتف</label><input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" value="${esc(cust.phone)}"><span class="err">اكتب رقم هاتف صحيح</span></div>
      <div class="fld" data-f="address"><label for="f-address">العنوان</label><textarea id="f-address" autocomplete="street-address">${esc(cust.address)}</textarea><span class="err">اكتب عنوان التوصيل</span></div>
      <div class="fld" data-f="notes"><label for="f-notes">ملاحظات (اختياري)</label><textarea id="f-notes">${esc(cust.notes)}</textarea></div>
    </form>`;
  updateLink();
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

document.addEventListener("input", e => {
  const m = e.target.id && e.target.id.match(/^f-(name|phone|address|notes)$/); if (!m) return;
  cust[m[1]] = e.target.value; store.set("atoz-cust", cust);
  e.target.closest(".fld").dataset.bad = "0"; updateLink();
});

function buildMessage() {
  const L = [];
  L.push("طلب جديد من موقع " + CONFIG.storeName, "");
  L.push("الاسم: " + cust.name.trim());
  L.push("الهاتف: " + cust.phone.trim());
  L.push("العنوان: " + cust.address.trim(), "");
  L.push("المنتجات:");
  Object.keys(cart).forEach((id, i) => { const p = PRODUCTS[id], q = cart[id];
    L.push((i + 1) + ". " + p.n + " × " + q + " = " + fmt(p.p * q) + " " + CONFIG.currency); });
  L.push("", "المجموع: " + fmt(cartTotal()) + " " + CONFIG.currency);
  if (cust.notes.trim()) L.push("", "ملاحظات: " + cust.notes.trim());
  return L.join("\n");
}
function updateLink() {
  const num = (CONFIG.whatsapp || "").replace(/\D/g, "");
  $("send").href = "https://wa.me/" + num + "?text=" + encodeURIComponent(buildMessage());
}
function validate() {
  const rules = { name: v => v.trim().length >= 2, phone: v => v.replace(/\D/g, "").length >= 7, address: v => v.trim().length >= 4 };
  let first = null;
  Object.keys(rules).forEach(k => {
    const bad = !rules[k](cust[k]);
    const f = document.querySelector(`.fld[data-f="${k}"]`); if (f) f.dataset.bad = bad ? "1" : "0";
    if (bad && !first) first = k;
  });
  if (first) { const el = $("f-" + first); el.focus(); el.scrollIntoView({ block: "center" }); }
  return !first;
}
$("send").addEventListener("click", e => {
  if (!cartCount()) { e.preventDefault(); return; }
  if (!validate()) { e.preventDefault(); toast("أكمل الاسم والهاتف والعنوان أولاً"); return; }
  if (!CONFIG.whatsapp) { e.preventDefault(); toast("رقم واتساب المتجر غير مضبوط بعد"); return; }
  updateLink();
});

/* ===== تشغيل ===== */
renderChips(); renderGrid(); updateBar();
</script>
